name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dx-core:
    name: Test DX-Core (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dx-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  dx-rag:
    name: Test DX-RAG (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dx-rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  dx-portal:
    name: Test & Build DX-Portal (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/dx-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run build
