# ============================================================================
# DX-Lab OSS — Điều phối toàn hệ thống
# Dựng một lệnh:  docker compose up -d   (hoặc: make up)
#
# GIAI ĐOẠN G0/G1: hiện có [D] PostgreSQL (SSOT) + [H] Keycloak (SSO).
# Các service khác (Baserow, Node-RED, Metabase, Nextcloud, Rocket.Chat,
# Ollama/Qdrant, và 4 service tự viết) sẽ được bổ sung theo lộ trình docs/du-an.md §7.
# ============================================================================

services:
  # --- [D] Nguồn sự thật duy nhất (Single Source of Truth) ---
  postgres:
    image: postgres:16-alpine
    container_name: dxlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/platforms/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dxlab

  # --- [H] Định danh tập trung — SSO / OIDC ---
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: dxlab-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Cố định issuer = localhost:8080 (trình duyệt), cho phép backchannel động
      # để container dx-portal gọi token qua keycloak:8080. Giải bài toán mạng Docker.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      TZ: ${TZ}
    volumes:
      - ./src/platforms/keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dxlab

  # --- DX-Core (tự viết) — Trục trung gian hướng sự kiện ---
  dx-core:
    build: ./src/dx-core
    container_name: dxlab-dx-core
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${DX_CORE_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dxlab

  # --- DX-Portal (tự viết) — Cổng thông tin nội bộ [H] (nguồn sự thật duy nhất) ---
  dx-portal:
    build: ./src/dx-portal
    container_name: dxlab-dx-portal
    restart: unless-stopped
    environment:
      DX_CORE_URL: http://dx-core:8000
      DX_RAG_URL: http://dx-rag:8001
      NEXTAUTH_URL: http://localhost:${DX_PORTAL_PORT}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      KEYCLOAK_ID: ${KEYCLOAK_ID}
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_WELLKNOWN: ${KEYCLOAK_WELLKNOWN}
      NEXT_PUBLIC_METABASE_URL: http://localhost:${METABASE_PORT}/dashboard/2
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT}
      NEXT_PUBLIC_DX_CORE_URL: http://localhost:${DX_CORE_PORT}/docs
      NEXT_PUBLIC_BASEROW_URL: http://localhost:${BASEROW_PORT}
      TZ: ${TZ}
    ports:
      - "${DX_PORTAL_PORT}:3000"
    depends_on:
      - dx-core
    networks:
      - dxlab

  # --- [H] Nextcloud — Lưu trữ tài liệu chuẩn P.A.R.A ---
  nextcloud:
    image: nextcloud:30-apache
    container_name: dxlab-nextcloud
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1 nextcloud"
      TZ: ${TZ}
    volumes:
      - nextcloud-data:/var/www/html
    ports:
      - "${NEXTCLOUD_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dxlab

  # --- [P] Baserow — Low-code DB / Form (điểm nhập liệu + Poka-yoke) ---
  # Ảnh all-in-one khá nặng (~1.5GB). Bật khi cần: docker compose up -d baserow
  baserow:
    image: baserow/baserow:1.30.1
    container_name: dxlab-baserow
    restart: unless-stopped
    environment:
      BASEROW_PUBLIC_URL: http://localhost:${BASEROW_PORT}
      TZ: ${TZ}
    volumes:
      - baserow-data:/baserow/data
    ports:
      - "${BASEROW_PORT}:80"
    networks:
      - dxlab

  # --- [D] Metabase — BI Dashboard (đọc dữ liệu, không đổi gốc) ---
  metabase:
    image: metabase/metabase:v0.51.8
    container_name: dxlab-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_HOST: postgres
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${METABASE_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dxlab

  # --- [I] Qdrant — Cơ sở dữ liệu véc-tơ ---
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: dxlab-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    networks:
      - dxlab

  # --- DX-RAG (tự viết) — Trợ lý AI nội bộ chống ảo giác [I] ---
  dx-rag:
    build: ./src/dx-rag
    container_name: dxlab-dx-rag
    restart: unless-stopped
    environment:
      LLM_MODE: ${LLM_MODE}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL}
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      QDRANT_HOST: ${QDRANT_HOST}
      NEXTCLOUD_URL: http://nextcloud:80
      NEXTCLOUD_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_KNOWLEDGE_PATH: ${NEXTCLOUD_KNOWLEDGE_PATH}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${DX_RAG_PORT}:8001"
    depends_on:
      - qdrant
    networks:
      - dxlab

  # --- [I] Ollama — LLM cục bộ (tùy chọn, nặng máy). Bật: docker compose --profile local-llm up -d ---
  ollama:
    image: ollama/ollama:0.5.4
    container_name: dxlab-ollama
    profiles: ["local-llm"]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - dxlab

volumes:
  postgres-data:
  baserow-data:
  qdrant-data:
  ollama-data:
  nextcloud-data:

networks:
  dxlab:
    driver: bridge
