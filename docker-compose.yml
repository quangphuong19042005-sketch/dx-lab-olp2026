# ============================================================================
# DX-Lab OSS — Điều phối toàn hệ thống
# Dựng một lệnh:  docker compose up -d   (hoặc: make up)
#
# GIAI ĐOẠN G0/G1: hiện có [D] PostgreSQL (SSOT) + [H] Keycloak (SSO).
# Các service khác (Baserow, Node-RED, Metabase, Nextcloud, Rocket.Chat,
# Ollama/Qdrant, và 4 service tự viết) sẽ được bổ sung theo lộ trình docs/du-an.md §7.
# ============================================================================

services:
  # --- [D] Nguồn sự thật duy nhất (Single Source of Truth) ---
  postgres:
    image: postgres:16-alpine
    container_name: dxlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/platforms/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dxlab

  # --- [H] Định danh tập trung — SSO / OIDC ---
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: dxlab-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      TZ: ${TZ}
    volumes:
      - ./src/platforms/keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dxlab

  # --- DX-Core (tự viết) — Trục trung gian hướng sự kiện ---
  dx-core:
    build: ./src/dx-core
    container_name: dxlab-dx-core
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID}
      TZ: ${TZ}
    ports:
      - "${DX_CORE_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dxlab

  # --- [P] Baserow — Low-code DB / Form (điểm nhập liệu + Poka-yoke) ---
  # Ảnh all-in-one khá nặng (~1.5GB). Bật khi cần: docker compose up -d baserow
  baserow:
    image: baserow/baserow:1.30.1
    container_name: dxlab-baserow
    restart: unless-stopped
    environment:
      BASEROW_PUBLIC_URL: http://localhost:${BASEROW_PORT}
      TZ: ${TZ}
    volumes:
      - baserow-data:/baserow/data
    ports:
      - "${BASEROW_PORT}:80"
    networks:
      - dxlab

  # --- [D] Metabase — BI Dashboard (đọc dữ liệu, không đổi gốc) ---
  metabase:
    image: metabase/metabase:v0.51.8
    container_name: dxlab-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_HOST: postgres
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${METABASE_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dxlab

volumes:
  postgres-data:
  baserow-data:

networks:
  dxlab:
    driver: bridge
